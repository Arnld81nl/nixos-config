# Noctalia v5 declarative config.
#
# This is the *base* config, deployed read-only by Home Manager to
# ~/.config/noctalia/config.toml. Changes made in the Settings GUI are written
# by Noctalia to ~/.config/noctalia/settings.toml and layered on top, so GUI
# tweaks survive rebuilds without the v4 hash/copy dance.
#
# Keep /home/USER as the literal placeholder: home/shells/noctalia/shell.nix
# substitutes the real home directory at build time so the repo stays portable.
#
# Validate after editing:  noctalia config validate home/shells/noctalia/config.toml

[shell]
font_family            = "Adwaita Sans"
settings_show_advanced = true

[shell.animation]
enabled = true
speed   = 1.0

[shell.panel]
transparency_mode        = "soft"
borders                  = false
shadow                   = true
launcher_placement       = "attached"
clipboard_placement      = "attached"
control_center_placement = "attached"
wallpaper_placement      = "attached"
session_placement        = "attached"

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode    = "dark"
source  = "builtin"
builtin = "Kanagawa"

# Only the ghostty builtin template is enabled. It rewrites
# ~/.config/ghostty/themes/noctalia, which home/ghostty.nix seeds as a writable
# file and references with `theme = noctalia` — the same arrangement as v4. Its
# apply hook is a no-op while that line is already present, so it never tries to
# write the read-only Home Manager config.
#
# The gtk3/gtk4/qt templates are deliberately NOT enabled: they rewrite
# ~/.config/gtk-3.0/gtk.css and ~/.config/gtk-4.0/gtk.css, which Home Manager
# manages (home/shells/noctalia/theming.nix), and activation then fails on the
# clobbered files.
#
# Note that a template left out here still gets its undo hook run at every
# startup, so a disabled template whose undo touches a Home-Manager-owned file
# logs a warning on each start.
[theme.templates]
enable_builtin_templates   = true
builtin_ids                = ["ghostty"]
enable_community_templates = false

# Hyprland palette.
#
# Deliberately NOT the builtin `hyprland` template: that one runs an apply.sh
# which probes the running compositor and, whenever it reads as Lua-config mode,
# writes ~/.config/hypr/hyprland.lua. A stray hyprland.lua outranks
# hyprland.conf and boots a stock desktop (see CLAUDE.md "Hyprland 0.56+ Lua
# Config"). It would also try to append a source line to hyprland.conf, which is
# a read-only Home Manager symlink.
#
# Rendering the same shipped template ourselves keeps the output path fixed and
# the include declarative (home/hyprland/default.nix sources it).
#
# The output is deliberately NOT named noctalia.conf: the builtin template's
# undo.sh runs on every startup while that template is disabled, and it deletes
# ~/.config/hypr/noctalia.conf and strips any `source = ...noctalia.conf` line
# from hyprland.conf — which would wipe the palette and fail against the
# read-only Home Manager symlink.
[theme.templates.user.hyprland]
input_path  = "@NOCTALIA_TEMPLATES@/hyprland/hyprland.conf"
output_path = "/home/USER/.config/hypr/noctalia-colors.conf"
post_hook   = "hyprctl reload"

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled             = true
fill_mode           = "crop"
directory           = "/home/USER/Pictures/Wallpapers"
transition          = ["fade", "wipe", "disc", "stripes", "honeycomb"]
transition_duration = 1500

[wallpaper.automation]
enabled = false

# ── Lock screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled        = true
blur_intensity = 0.5
tint_intensity = 0.3
# Flipped to true by shell.nix on hosts with services.fprintd.enable.
fingerprint    = false

# Idle handling stays with hypridle (home/hyprland/hypridle.nix); leaving these
# disabled avoids two daemons racing to lock the session.
[idle.behavior.lock]
enabled = false

[idle.behavior.screen-off]
enabled = false

# ── System monitor ────────────────────────────────────────────────────────────

[system.monitor]
enabled = true

# ── Bar ───────────────────────────────────────────────────────────────────────

[bar.main]
position      = "top"
reserve_space = true

# v5 defaults float the bar: margin_ends = 100 insets it 100px from each end and
# margin_edge lifts it off the screen edge. Zeroing both restores the v4
# edge-to-edge bar. With margin_ends = 0 the default concave_edge_corners carves
# the two inner corners instead of rounding the outer ones, so `radius` stays
# at its default.
margin_ends   = 0
margin_edge   = 0

start  = ["launcher", "group:sysmon", "clock"]
center = ["workspaces"]
end    = ["group:vpn", "group:ai", "group:tools", "control-center"]

# Capsules do the decluttering. Fourteen widgets separated by identical gaps read
# as one long run; four pills give the eye somewhere to break, without dropping
# anything from the bar.
#
# A group is itself a lane item: the lane lists `group:<id>` where the group sits,
# and its members are named here instead of in the lane. Listing the members in
# the lane as well is what a bare `capsule_group` silently does nothing about —
# they render, ungrouped, with no capsule and no accordion.
#
# Everything left out of a group (launcher, control-center) stays a bare button
# on purpose — they are menus, not readouts.
capsule_group = [
  # Three sysmon widgets that used to float apart as one readout again.
  { id = "sysmon", members = ["cpu", "cpu-temp", "ram"] },

  # accordion = true draws only the first member — vpn-status, the plugin pill —
  # and unfolds the three toggles when the capsule is hovered. accordion_direction
  # is where they unfold relative to that first widget: "end" keeps them in
  # 1-2-3 order to its right, growing the (right-aligned) end lane leftwards.
  { id = "vpn", members = ["vpn-status", "vpn1", "vpn2", "vpn3"], accordion = true, accordion_direction = "end" },

  # One member on purpose: ai-usage is the only text readout on this side and
  # keeps its own pill. A plugin widget cannot take `capsule = true` directly.
  { id = "ai", members = ["ai-usage"] },

  { id = "tools", members = ["caffeine", "notifications", "battery", "volume", "tray"] },
]

[widget.clock]
format         = "{:%H:%M %a, %b %d}"
tooltip_format = "{:%A, %B %d, %Y}"
# Own capsule: it sits next to the sysmon pill and reads as a stray label
# otherwise. The date stays on the bar — it is information, not clutter.
capsule        = true

# v4 packed CPU / temp / RAM into one SystemMonitor widget; v5 sysmon shows one
# stat per instance, so the same readout is three widgets — held together again
# by the `sysmon` capsule group above.
#
# label_min_width reserves room for the widest value each stat reaches ("100%",
# "-40°C", "12.3 GiB"). Without it the capsule resizes every second as the
# numbers gain and lose a digit, and everything left of it twitches along.
[widget.cpu]
type            = "sysmon"
stat            = "cpu_usage"
label_min_width = 34

[widget.cpu-temp]
type            = "sysmon"
stat            = "cpu_temp"
label_min_width = 42

[widget.ram]
type            = "sysmon"
stat            = "ram_used"
label_min_width = 54

# ── Plugins ───────────────────────────────────────────────────────────────────
#
# Noctalia always scans ~/.local/share/noctalia/plugins, where
# home/shells/noctalia/shell.nix deploys ./plugins/*. Discovery alone is not
# enough: a plugin runs only once its id is listed here.
[plugins]
enabled = ["arnold/ai-usage", "arnold/vpn"]

# ── VPN ───────────────────────────────────────────────────────────────────────
#
# The `vpn` capsule group above makes this an accordion: only vpn-status is drawn
# until the capsule is hovered, and the three toggles slide out then.
#
# vpn-status is the visible half. v4's CustomButton could poll a command for its
# label; v5's custom_button cannot, which is why the three shields used to show
# no state at all. home/shells/noctalia/plugins/vpn polls `vpn-status --bar`
# instead and paints the connected names, so the collapsed pill is both smaller
# than the old three shields *and* says more than they did.
#
# Left click there re-reads immediately, so — as with ai-usage — it deliberately
# declares no [widget.vpn-status.actions]: a configured gesture binding takes the
# click before the plugin's own onClick sees it.
[widget.vpn-status]
type = "arnold/vpn:status"

# @VPNn_NAME@ is substituted by shell.nix from the gitignored secrets.nix. The
# names must not be committed, and "1" / "2" / "3" told you nothing about which
# button was which once the accordion opened.
[widget.vpn1]
type    = "custom_button"
glyph   = "shield"
label   = "@VPN1_NAME@"
tooltip = "Toggle @VPN1_NAME@"

[widget.vpn1.actions]
left = "exec bash /home/USER/.local/bin/vpn-1"

[widget.vpn2]
type    = "custom_button"
glyph   = "shield"
label   = "@VPN2_NAME@"
tooltip = "Toggle @VPN2_NAME@"

[widget.vpn2.actions]
left = "exec bash /home/USER/.local/bin/vpn-2"

[widget.vpn3]
type    = "custom_button"
glyph   = "shield"
label   = "@VPN3_NAME@"
tooltip = "Toggle @VPN3_NAME@"

[widget.vpn3.actions]
left = "exec bash /home/USER/.local/bin/vpn-3"

# ── Trims ─────────────────────────────────────────────────────────────────────
#
# Text that was on the bar without being read. Nothing is lost: the volume level
# is still in the icon and the tooltip, and the bell comes back the moment
# something is unread.
[widget.volume]
type       = "volume"
show_label = false

[widget.notifications]
type                = "notifications"
hide_when_no_unread = true

# Only at 100% — hide_when_plugged would also blank it while charging, which is
# exactly when the number is worth watching.
[widget.battery]
type           = "battery"
hide_when_full = true

# The one command-output widget that survived the v4 -> v5 move, as a plugin:
# home/shells/noctalia/plugins/ai-usage polls `ai-usage --bar` and paints its
# text, tooltip and threshold color. Left click there forces a re-read, so this
# entry deliberately declares no [widget.ai-usage.actions] — a configured
# gesture binding takes the click before the plugin's own onClick sees it.
#
# Its capsule comes from the one-member `ai` group above rather than from
# `capsule = true` here: plugin widgets only accept the settings their plugin
# declares, and `noctalia config validate` flags a per-widget capsule on one as
# an unknown setting.
[widget.ai-usage]
type = "arnold/ai-usage:usage"
